[package]
name = "vexfs"
version = "0.1.0"
edition = "2021"
description = "A next-generation AI-augmented filesystem"
license = "MIT"

[lib]
name = "vexfs"
path = "src/lib.rs"

# ── Unified CLI (replaces all scattered binaries) ─────────────────────────────
[[bin]]
name = "vexfs"
path = "src/bin/vexfs.rs"

# ── Internal / power-user binaries ────────────────────────────────────────────
[[bin]]
name = "vexfs_bench"
path = "src/bin/vexfs_bench.rs"

[[bin]]
name = "vexfs_daemon"
path = "src/bin/vexfs_daemon.rs"

[[bin]]
name = "vexfs_fsck"
path = "src/bin/vexfs_fsck.rs"

[[bin]]
name = "vexfs_gui"
path = "src/bin/vexfs_gui.rs"

[dependencies]
fuser      = "0.14"
libc       = "0.2"
zerocopy   = { version = "0.7", features = ["derive"] }
blake3     = "1.5"
log        = "0.4"
env_logger = "0.11"
thiserror  = "1.0"
crc32fast  = "1.4"
zstd       = "0.13"
clap       = { version = "4.5", features = ["derive", "color"] }
egui       = "0.29"
eframe     = { version = "0.29", default-features = false, features = [
    "default_fonts", "glow",
] }

[dev-dependencies]
tempfile  = "3.0"
criterion = "0.5"

[[bench]]
name = "cache_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
